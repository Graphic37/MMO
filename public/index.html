<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combat MMO - Multiplayer RPG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: #9ca3af;
            margin-bottom: 40px;
            font-size: 1.2rem;
        }
        .name-input {
            width: 100%;
            max-width: 300px;
            padding: 15px 20px;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #374151;
            border-radius: 10px;
            color: white;
            margin-bottom: 20px;
            text-align: center;
        }
        .name-input:focus {
            outline: none;
            border-color: #fbbf24;
        }
        .play-btn {
            display: inline-block;
            padding: 18px 60px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(145deg, #22c55e, #16a34a);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            margin-bottom: 30px;
        }
        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(34, 197, 94, 0.6);
        }
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        .feature {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #374151;
        }
        .feature-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .feature-title {
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 5px;
        }
        .feature-desc {
            color: #9ca3af;
            font-size: 0.9rem;
        }
        .server-status {
            margin-top: 30px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ Combat MMO</h1>
        <p class="subtitle">Free Multiplayer Action RPG</p>
        
        <input type="text" class="name-input" id="playerName" placeholder="Enter your name..." maxlength="20">
        
        <br>
        <button class="play-btn" onclick="playGame()">▶ PLAY NOW</button>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🎮</div>
                <div class="feature-title">6 Classes</div>
                <div class="feature-desc">Ranger, Ice Mage, Fire Mage, Rogue, Monk, Warrior</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚔️</div>
                <div class="feature-title">PvP Combat</div>
                <div class="feature-desc">Battle other players in real-time</div>
            </div>
            <div class="feature">
                <div class="feature-icon">👹</div>
                <div class="feature-title">PvE Monsters</div>
                <div class="feature-desc">Hunt goblins, orcs, and more</div>
            </div>
        </div>
        
        <div class="server-status" id="serverStatus">
            <span class="status-dot"></span>
            Checking server status...
        </div>
    </div>
    
    <script>
        // Check server health
        fetch('/health')
            .then(res => res.json())
            .then(data => {
                document.getElementById('serverStatus').innerHTML = 
                    `<span class="status-dot"></span> Server Online - ${data.players} players`;
            })
            .catch(() => {
                document.getElementById('serverStatus').innerHTML = 
                    `<span class="status-dot" style="background: #f59e0b;"></span> Connecting...`;
            });
        
        // Load saved name
        const savedName = localStorage.getItem('mmoPlayerName');
        if (savedName) {
            document.getElementById('playerName').value = savedName;
        }
        
        function playGame() {
            const name = document.getElementById('playerName').value.trim() || 'Player' + Math.floor(Math.random() * 9999);
            localStorage.setItem('mmoPlayerName', name);
            window.location.href = '/game.html';
        }
        
        // Enter key to play
        document.getElementById('playerName').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') playGame();
        });
    </script>
</body>
</html>
